query DependabotPRByNumber($owner: String!, $name: String!, $number: Int!) {
	repository(owner: $owner, name: $name) {
		pullRequest(number: $number) {
			bodyText
			state
			...DependabotPRFields
			labels(first: 100) { pageInfo { hasNextPage endCursor } nodes { name } }
		}
	}
}
fragment DependabotPRFields on PullRequest {
	number
	title
	headRefName
	author { login }
	mergeable
	commits(last: 1) {
		nodes {
			commit {
				id
				statusCheckRollup {
					contexts(first: 100) { ...CheckContextFields }
				}
			}
		}
	}
}
fragment CheckContextFields on StatusCheckRollupContextConnection {
	pageInfo { hasNextPage endCursor }
	nodes {
		... on CheckRun { conclusion }
		... on StatusContext { state }
	}
}

