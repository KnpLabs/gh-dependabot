query DependabotPRs($owner: String!, $name: String!, $after: String) {
		repository(owner: $owner, name: $name) {
			pullRequests(states: OPEN, first: 100, after: $after) {
				pageInfo { hasNextPage endCursor }
				nodes {
					...DependabotPRFields
				}
			}
		}
	}
fragment DependabotPRFields on PullRequest {
	number
	title
	headRefName
	author { login }
	mergeable
	commits(last: 1) {
		nodes {
			commit {
				id
				statusCheckRollup {
					contexts(first: 100) { ...CheckContextFields }
				}
			}
		}
	}
}
fragment CheckContextFields on StatusCheckRollupContextConnection {
	pageInfo { hasNextPage endCursor }
	nodes {
		... on CheckRun { conclusion }
		... on StatusContext { state }
	}
}

variables: {"name":"fake-repo","owner":"knplabs"}

