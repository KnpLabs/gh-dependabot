name: release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: runs-on=${{ github.run_id }}/runner=small
    steps:
      - uses: runs-on/action@v2
      - uses: actions/checkout@v7
      - uses: cli/gh-extension-precompile@v2
        with:
          generate_attestations: true
          go_version_file: go.mod
